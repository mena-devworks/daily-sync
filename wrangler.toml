name = "daily-sync"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "daily-sync-db"
database_id = "__D1_ID__"
