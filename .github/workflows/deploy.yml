name: deploy
on:
  push:
    branches: [main]
    paths: ['worker/**', 'public/**', 'db/**', 'wrangler.toml', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      W: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ensure D1 database
        run: |
          ID=$($W d1 list --json | jq -r '.[] | select(.name=="daily-sync-db") | .uuid')
          if [ -z "$ID" ]; then $W d1 create daily-sync-db >/dev/null; ID=$($W d1 list --json | jq -r '.[] | select(.name=="daily-sync-db") | .uuid'); fi
          [ -n "$ID" ] || { echo "Could not create D1 database"; exit 1; }
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: Ensure R2 bucket (optional)
        run: |
          if $W r2 bucket list 2>/dev/null | grep -q 'daily-sync-files' || $W r2 bucket create daily-sync-files >/dev/null 2>&1; then
            printf '\n[[r2_buckets]]\nbinding = "FILES"\nbucket_name = "daily-sync-files"\n' >> wrangler.toml
            echo "R2 bucket ready"
          else
            echo "::warning::R2 is not enabled on this Cloudflare account yet - files will be stored later once it is."
          fi
      - name: Apply schema
        run: $W d1 execute daily-sync-db --remote --file db/schema.sql --yes
      - name: Build
        run: |
          mkdir -p dist && cp -r public/. dist/ && cp worker/index.js dist/_worker.js
      - name: Ensure Pages project
        run: |
          $W pages project list 2>/dev/null | grep -q ' daily-sync ' || $W pages project create daily-sync --production-branch main
      - name: Deploy
        run: $W pages deploy --branch main --commit-dirty=true
      - name: Push secrets
        env:
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
        run: |
          if [ -n "$SETUP_CODE" ]; then printf '%s' "$SETUP_CODE" | $W pages secret put SETUP_CODE --project-name daily-sync >/dev/null && echo "SETUP_CODE set"; fi
