<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sign in</title>
<meta name="theme-color" content="#070b24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Job Hunter">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<script src="/theme.js"></script>
</head>
<body>
<!-- ================= auth ================= -->
<div class="auth" id="auth">
  <div class="auth-art">
    <svg class="radar" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <defs><radialGradient id="rg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#21d4fd" stop-opacity=".35"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></radialGradient>
      <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21d4fd" stop-opacity=".7"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></linearGradient></defs>
      <circle cx="200" cy="200" r="190" fill="url(#rg)"/>
      <g stroke="#6fb8ff" stroke-opacity=".35"><circle cx="200" cy="200" r="60"/><circle cx="200" cy="200" r="110"/><circle cx="200" cy="200" r="160"/><path d="M200 20v360M20 200h360"/></g>
      <path d="M200 200 L200 40 A160 160 0 0 1 338 120 Z" fill="url(#sw)"/>
      <g fill="#fff"><circle cx="270" cy="120" r="5"/><circle cx="130" cy="260" r="4" opacity=".7"/><circle cx="300" cy="250" r="6"/><circle cx="160" cy="150" r="3" opacity=".6"/></g>
      <g transform="translate(168 172)"><rect width="64" height="48" y="10" rx="10" fill="#0075ff"/><rect x="20" width="24" height="16" rx="5" stroke="#fff" stroke-width="4" fill="none"/><rect y="26" width="64" height="5" fill="#21d4fd" opacity=".8"/></g>
    </svg>
    <div class="brand"><span class="logo" data-ic="logo"></span><span class="wm">Job <b>Hunter</b></span></div>
    <h2 style="margin-top:22px" data-t="artTitle"></h2><p data-t="artText"></p>
  </div>
  <div class="auth-side" style="position:relative">
    <div class="auth-top"><button class="ghost sm thm" type="button"></button><button class="ghost sm" id="langBtn">العربية</button></div>

    <div id="v-setup" class="card hidden">
      <div class="brand"><span class="logo" data-ic="logo"></span><span class="wm">Job <b>Hunter</b></span></div>
      <h1 data-t="setupTitle"></h1><p class="mute" data-t="setupHint"></p>
      <label data-t="setupCode"></label><input id="s-code" type="password" autocomplete="off">
      <label data-t="name"></label><input id="s-name">
      <label data-t="email"></label><input id="s-email" type="email">
      <label data-t="password"></label><input id="s-pw" type="password" autocomplete="new-password">
      <label data-t="confirmPw"></label><input id="s-pw2" type="password" autocomplete="new-password">
      <button id="s-go" style="width:100%;margin-top:20px" data-t="create"></button>
      <div class="msg" id="s-msg"></div>
    </div>

    <div id="v-login" class="card hidden">
      <div class="brand"><span class="logo" data-ic="logo"></span><span class="wm">Job <b>Hunter</b></span></div>
      <h1 data-t="welcome"></h1><p class="mute" style="margin:0" data-t="loginHint"></p>
      <label data-t="email"></label><input id="l-email" type="email" autocomplete="username">
      <label data-t="password"></label><input id="l-pw" type="password" autocomplete="current-password">
      <button id="l-go" style="width:100%;margin-top:20px" data-t="signIn"></button>
      <div class="row" style="margin-top:10px;justify-content:center"><button class="ghost sm" id="l-forgot" data-t="forgot"></button></div>
      <div class="msg" id="l-msg"></div>
    </div>

    <div id="v-recover" class="card hidden">
      <div class="brand"><span class="logo" data-ic="logo"></span><span class="wm">Job <b>Hunter</b></span></div>
      <h1 data-t="recoverTitle"></h1><p class="mute" data-t="recoverHint"></p>
      <label data-t="setupCode"></label><input id="r-code" type="password" autocomplete="off">
      <label data-t="email"></label><input id="r-email" type="email" autocomplete="username">
      <label data-t="newPw"></label><input id="r-pw" type="password" autocomplete="new-password">
      <label data-t="confirmPw"></label><input id="r-pw2" type="password" autocomplete="new-password">
      <div class="row" style="margin-top:20px"><button id="r-go" data-t="save"></button><button class="ghost" id="r-back" data-t="back"></button></div>
      <div class="msg" id="r-msg"></div>
    </div>

    <div id="v-setpw" class="card hidden">
      <div class="brand"><span class="logo" data-ic="logo"></span><span class="wm">Job <b>Hunter</b></span></div>
      <h1 data-t="setPw"></h1>
      <label data-t="newPw"></label><input id="p-pw" type="password" autocomplete="new-password">
      <label data-t="confirmPw"></label><input id="p-pw2" type="password" autocomplete="new-password">
      <button id="p-go" style="width:100%;margin-top:20px" data-t="save"></button>
      <div class="msg" id="p-msg"></div>
    </div>
  </div>
</div>

<!-- ================= app ================= -->
<div id="v-home" class="app hidden">
  <aside class="side"><div class="side-in">
    <div class="brand"><span class="logo" data-ic="logo"></span><span class="wm">Job <b>Hunter</b></span></div>
    <nav class="nav" id="tabs">
      <button data-tab="overview"><span class="ic" data-ic="home"></span><span data-t="overview"></span></button>
      <button data-tab="subs"><span class="ic" data-ic="users"></span><span data-t="subs"></span></button>
      <div class="nav-h own" data-t="admin"></div>
      <button class="own" data-tab="team"><span class="ic" data-ic="shield"></span><span data-t="admins"></span></button>
      <button class="own" data-tab="settings"><span class="ic" data-ic="gear"></span><span data-t="settings"></span></button>
    </nav>
    <div class="help"><span class="ic" data-ic="radar"></span><b data-t="engineCard"></b><p data-t="engineCardHint"></p><button id="side-run" data-t="runNow"></button></div>
  </div></aside>

  <main class="main">
    <header class="top">
      <span class="logo mlogo brand" style="padding:0"><span class="logo" data-ic="logo"></span></span>
      <div><div class="crumb"><span data-t="pages"></span> / <b id="crumb"></b></div><h1 id="pageTitle"></h1></div>
      <span class="sp"></span>
      <button class="ghost sm thm" type="button"></button>
      <button class="ghost sm" id="langBtn2">العربية</button>
      <span class="who"><span class="avatar" id="avatar"></span><span id="who"></span></span>
      <button class="ghost sm" id="out" data-t="signOut"></button>
    </header>

    <section data-p="overview">
      <div class="kpis" id="kpis"></div>
      <div class="ovgrid">
        <div class="card hero" id="hero"></div>
        <div class="card"><h2 data-t="autoRate"></h2><div class="sub-h" data-t="autoRateHint"></div><div class="gauge-wrap" id="gauge"></div></div>
        <div class="card"><h2 data-t="engineCard"></h2><div class="sub-h" id="engineSub"></div><div id="engineBox"></div></div>
      </div>
      <div class="chartgrid">
        <div class="card chart"><h2 data-t="appsChart"></h2><div class="sub-h" id="appsSub"></div><div id="areaChart"></div>
          <div class="legend"><span><i style="background:#21d4fd"></i><span data-t="sentCol"></span></span><span><i style="background:#0075ff"></i><span data-t="manualCol"></span></span></div></div>
        <div class="card chart"><h2 data-t="jobsByField"></h2><div class="sub-h" id="fieldsSub"></div><div class="bars" id="barChart"></div><div class="stat2" id="fieldStats"></div></div>
      </div>
      <div class="card" id="runs-card"><div class="row" style="margin-bottom:6px"><h2 style="margin:0" data-t="runs"></h2><span class="sp"></span><span id="run-msg" class="mute" style="font-size:12px"></span><button class="sm" id="run-now" data-t="runNow"></button></div><div id="runs" style="overflow-x:auto"></div></div>
    </section>

    <section class="card hidden" data-p="subs">
      <div class="row"><h2 style="margin:0" data-t="subs"></h2><span class="sp"></span><input id="q" style="max-width:240px" data-ph="search"><button id="addSub" data-t="addSub"></button></div>
      <table class="stack" style="margin-top:12px"><thead><tr><th data-t="name"></th><th data-t="status"></th><th data-t="subEnd"></th><th data-t="citiesFields"></th><th data-t="appsTodayShort"></th><th>CV</th><th></th></tr></thead><tbody id="subs"></tbody></table>
      <div class="msg" id="s2-msg"></div>
    </section>

    <section class="card hidden" data-p="edit">
      <div class="row"><h2 style="margin:0" id="e-title"></h2><span class="sp"></span><button class="ghost sm" id="e-cancel" data-t="back"></button></div>
      <div class="grid2">
        <div><label data-t="name"></label><input id="e-name"></div>
        <div><label data-t="email"></label><input id="e-email" type="email"></div>
        <div><label data-t="curCountry"></label><select id="e-country"><option value="">—</option><option value="EG">Egypt / مصر</option><option value="AE">UAE / الإمارات</option><option value="SA">Saudi Arabia / السعودية</option><option value="OTHER">Other / أخرى</option></select></div>
        <div><label data-t="curCity"></label><input id="e-city"></div>
        <div><label data-t="subEnd"></label><div class="row"><input id="e-end" type="date" style="flex:1;width:auto"><button class="ghost sm" id="e-plus" data-t="plusMonth"></button></div><small class="mute" id="e-start"></small></div>
      </div>
      <label data-t="cv"></label><input id="e-cv" type="file" accept=".pdf,.docx,.txt">
      <small class="mute"><span id="e-cvinfo"></span> <a id="e-cvdl" class="hidden" data-t="download"></a></small>
      <div id="e-access" class="hidden"><h3 data-t="subAccess"></h3><p class="mute" style="margin:0;font-size:13px" id="e-accinfo"></p><button class="ghost sm" id="e-link" style="margin-top:8px" data-t="pwLink"></button><div class="msg" id="e-linkmsg"></div></div>
      <h3 data-t="sendMode"></h3>
      <p class="mute" style="margin:0;font-size:13px" id="e-modeinfo"></p>
      <label data-t="appPwOpt"></label><input id="e-ap" type="password" autocomplete="new-password" style="max-width:320px">
      <label class="opt hidden" id="e-apclearbox"><input type="checkbox" id="e-apclear"><span data-t="apClear"></span></label>
      <h3 data-t="cities"></h3><div id="e-cities"></div>
      <h3 data-t="fields"></h3><p class="mute" style="margin:0 0 10px;font-size:12px" data-t="fieldsHint"></p><div id="e-fields" class="chips"></div>
      <div class="row" style="margin-top:22px"><button id="e-save" data-t="save"></button><span class="sp"></span><button class="ghost sm" id="e-del" data-t="delete"></button></div>
      <div class="msg" id="e-msg"></div>
    </section>

    <section class="card hidden" data-p="settings"><h2 data-t="settings"></h2><p class="mute" style="font-size:12px" data-t="settingsHint"></p>
      <div class="grid2" id="set-form"></div><div class="row" style="margin-top:18px"><button id="set-save" data-t="save"></button></div><div class="msg" id="set-msg"></div></section>

    <section class="card hidden" id="c-staff" data-p="team">
      <h2 data-t="admins"></h2>
      <table class="stack"><thead><tr><th data-t="name"></th><th data-t="email"></th><th data-t="role"></th><th data-t="status"></th><th></th></tr></thead><tbody id="staff"></tbody></table>
      <h2 style="margin-top:22px" data-t="addAdmin"></h2>
      <div class="row"><input id="a-name" style="max-width:220px" data-ph="name"><input id="a-email" type="email" style="max-width:260px" data-ph="email"><button id="a-go" data-t="add"></button></div>
      <div class="msg" id="a-msg"></div>
    </section>
  </main>

  <nav class="bnav" id="mtabs">
    <button data-tab="overview"><span class="ic" data-ic="home"></span><span data-t="overview"></span></button>
    <button data-tab="subs"><span class="ic" data-ic="users"></span><span data-t="subs"></span></button>
    <button class="own" data-tab="team"><span class="ic" data-ic="shield"></span><span data-t="admins"></span></button>
    <button class="own" data-tab="settings"><span class="ic" data-ic="gear"></span><span data-t="settings"></span></button>
  </nav>
</div>
<script>

function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';

async function call(path,opt={}){const r=await fetch(path,{method:opt.method||'GET',headers:{'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.error||r.status),{status:r.status});return d;}
function show(v){['setup','login','setpw','recover','home'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));$('auth').classList.toggle('hidden',v==='home');document.title=v==='home'?'Job Hunter Platform':'Sign in';}

const stat=s=>s.locked?'locked':s.sub_end<today()?'expired':'active';

function drawSubs(){const q=$('q').value.trim().toLowerCase();const rows=SUBS.filter(s=>!q||(s.name+' '+s.email).toLowerCase().includes(q));
  $('subs').innerHTML=rows.map(s=>`<tr><td><b>${esc(s.name)}</b><br><small class="mute">${esc(s.email)}</small></td><td><span class="pill ${stat(s)}">${t(stat(s))}</span>${s.reset_req?` <span class="pill partial">${t('resetReq')}</span>`:''}</td><td>${esc(s.sub_end)}</td><td>${s.cities} / ${s.fields}</td>
   <td>${s.apps_today}${s.apps_today?' ('+Math.round(100*s.auto_today/s.apps_today)+'%)':''}</td><td>${s.has_cv?'✓':'—'}</td>
   <td class="acts"><button class="ghost sm" data-a="edit" data-id="${s.id}">${t('edit')}</button> <button class="ghost sm" data-a="renew" data-id="${s.id}">${t('renew')}</button> <button class="ghost sm" data-a="${s.locked?'unlock':'lock'}" data-id="${s.id}">${t(s.locked?'unlock':'lock')}</button></td></tr>`).join('')||`<tr><td colspan="7" class="mute">${t('noSubs')}</td></tr>`;labelCells($('subs'));

async function openEdit(id){EDIT=id;msg('e-msg','');$('e-cv').value='';
  const s=id?await call('/api/subscribers/'+id):{name:'',email:'',current_country:'',current_city:'',lang:'en',send_mode:'central',sub_end:'',cities:[],fields:[]};
  $('e-title').textContent=t(id?'editSub':'addSub');$('e-name').value=s.name;$('e-email').value=s.email;$('e-country').value=s.current_country||'';
  $('e-city').value=s.current_city||'';$('e-end').value=s.sub_end||'';$('e-start').textContent=id?t('subStart')+': '+s.sub_start:t('autoMonth');
  $('e-apclear').checked=false;$('e-ap').value='';HASAP=!!s.has_app_password;modeUI();
  $('e-cvinfo').textContent=s.cv?`${s.cv.name} · ${Math.max(1,Math.round(s.cv.size/1024))} KB · ${s.cv.uploaded_at.slice(0,10)}`:t('noCv');
  $('e-cvdl').classList.toggle('hidden',!s.cv);if(s.cv)$('e-cvdl').href=`/api/subscribers/${id}/cv`;
  $('e-access').classList.toggle('hidden',!id);msg('e-linkmsg','');$('e-accinfo').textContent=id?(s.reset_requested?t('accReq').replace('{d}',fmtDT(s.reset_requested))+' ':'')+t(s.has_password?'accSet':'accNone'):'';

let HASAP=false;
function modeUI(){$('e-modeinfo').textContent=t(HASAP?'modeAppOn':'modeCentralOn');$('e-apclearbox').classList.toggle('hidden',!HASAP);}
function renderLists(cities,fields){KNOWN={c:new Set(cities.map(c=>c.country+'|'+c.city)),f:new Set(fields.map(f=>f.field))};
  const on=new Set(cities.filter(c=>c.enabled).map(c=>c.country+'|'+c.city)),fon=new Set(fields.filter(f=>f.enabled).map(f=>f.field));
  $('e-cities').innerHTML=Object.entries(CAT.cities).map(([co,list])=>`<details ${list.some(c=>on.has(co+'|'+c))?'open':''}><summary>${esc(CO[co][lang==='ar'?1:0])} <small class="mute" data-cnt="${co}"></small></summary>
    <div class="row" style="margin:8px 0"><button class="ghost sm" data-all="${co}">${t('all')}</button><button class="ghost sm" data-none="${co}">${t('none')}</button></div>
    <div class="chips">${list.map(c=>`<label class="chip"><input type="checkbox" data-co="${co}" value="${esc(c)}" ${on.has(co+'|'+c)?'checked':''}>${esc(nm(c))}</label>`).join('')}</div></details>`).join('');
  $('e-fields').innerHTML=CAT.fields.map(f=>`<label class="chip"><input type="checkbox" value="${esc(f)}" ${fon.has(f)?'checked':''}>${esc(nm(f))}</label>`).join('');
  $('e-cities').querySelectorAll('[data-all],[data-none]').forEach(b=>b.onclick=()=>{const co=b.dataset.all||b.dataset.none;
    $('e-cities').querySelectorAll(`input[data-co="${co}"]`).forEach(i=>i.checked=!!b.dataset.all);counts()});
  $('e-cities').onchange=counts;counts();}
function counts(){Object.keys(CAT.cities).forEach(co=>{const n=$('e-cities').querySelectorAll(`input[data-co="${co}"]:checked`).length;$('e-cities').querySelector(`[data-cnt="${co}"]`).textContent=n?'('+n+')':''})}
function readEdit(){const cities=[],fields=[];
  $('e-cities').querySelectorAll('input').forEach(i=>{if(i.checked||KNOWN.c.has(i.dataset.co+'|'+i.value))cities.push({country:i.dataset.co,city:i.value,enabled:i.checked})});
  $('e-fields').querySelectorAll('input').forEach(i=>{if(i.checked||KNOWN.f.has(i.value))fields.push({field:i.value,enabled:i.checked})});
  return {name:$('e-name').value,email:$('e-email').value,current_country:$('e-country').value,current_city:$('e-city').value,
    sub_end:$('e-end').value||undefined,app_password:$('e-ap').value||undefined,clear_app_password:$('e-apclear').checked,cities,fields};}
$('e-plus').onclick=()=>{const v=$('e-end').value,d=new Date(v&&v>today()?v:today());d.setUTCMonth(d.getUTCMonth()+1);$('e-end').value=d.toISOString().slice(0,10)};
$('e-cancel').onclick=()=>tab('subs');
$('e-link').onclick=async()=>{try{const d=await call(`/api/subscribers/${EDIT}/link`,{method:'POST'});
  $('e-linkmsg').innerHTML=esc(t('subLinkNote'))+'<div class="link">'+esc(d.link)+'</div><div class="link">'+esc(d.dashboard)+'</div>';$('e-linkmsg').classList.add('ok')}catch(e){msg('e-linkmsg',e.message)}};
$('e-del').onclick=async()=>{if(!confirm(t('confirmDel')))return;try{await call('/api/subscribers/'+EDIT,{method:'DELETE'});tab('subs')}catch(e){msg('e-msg',e.message)}};
const CDN='https://cdnjs.cloudflare.com/ajax/libs/';
const loadJs=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function cvText(f){const ext=f.name.split('.').pop().toLowerCase();
  try{if(ext==='txt')return await f.text();
    if(ext==='pdf'){if(!window.pdfjsLib)await loadJs(CDN+'pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+'pdf.js/3.11.174/pdf.worker.min.js';
      const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let s='';for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();s+=c.items.map(x=>x.str).join(' ')+'\n'}return s}
    if(ext==='docx'){if(!window.mammoth)await loadJs(CDN+'mammoth/1.6.0/mammoth.browser.min.js');return(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
  }catch(e){console.warn('cv text',e)}return '';}
$('e-save').onclick=async()=>{const b=readEdit();if(!b.cities.some(c=>c.enabled))return msg('e-msg',t('needCity'));
  const f=$('e-cv').files[0];if(f&&f.size>(CAT.storage?5e6:7e5))return msg('e-msg',t('tooBig')+' (max '+(CAT.storage?'5 MB':'700 KB')+')');
  $('e-save').disabled=true;msg('e-msg',t('saving'),true);
  try{let id=EDIT;if(id)await call('/api/subscribers/'+id,{method:'PUT',body:b});else{id=(await call('/api/subscribers',{method:'POST',body:b})).id;EDIT=id}
    if(f){const fd=new FormData();fd.append('file',f);fd.append('text',await cvText(f));
      const r=await fetch(`/api/subscribers/${id}/cv`,{method:'POST',body:fd,credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(t('cvFail')+': '+(d.error||r.status))}
    msg('e-msg',t('saved'),true);setTimeout(()=>tab('subs'),700)}catch(e){msg('e-msg',e.message)}finally{$('e-save').disabled=false}};

function paintIcons(root=document){root.querySelectorAll('[data-ic]').forEach(e=>{if(!e.firstChild)e.innerHTML=IC[e.dataset.ic]||''})}
function labelCells(tb){const th=[...tb.closest('table').querySelectorAll('thead th')].map(x=>x.textContent);tb.querySelectorAll('tr').forEach(r=>[...r.children].forEach((c,i)=>{if(th[i])c.dataset.l=th[i]}))}
const fmtDT=s=>s?new Date(s.replace(' ','T')+'Z').toLocaleString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
function smooth(pts){if(pts.length<2)return'';let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function areaSvg(days){const W=600,H=230,L=34,R=26,T=14,B=26,max=Math.max(4,...days.map(x=>Math.max(x.e,x.m)));const top=Math.ceil(max/4)*4;
  const X=i=>L+i*(W-L-R)/(days.length-1),Y=v=>T+(1-v/top)*(H-T-B);
  const line=k=>smooth(days.map((x,i)=>[X(i),Y(x[k])])),area=k=>line(k)+` L${X(days.length-1)},${H-B} L${X(0)},${H-B} Z`;
  let g='';for(let j=0;j<=4;j++){const v=top*j/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#56577a" stroke-dasharray="4 5" stroke-opacity=".5"/><text x="${L-8}" y="${y+4}" fill="#a0aec0" font-size="10" text-anchor="end">${v}</text>`}
  days.forEach((x,i)=>{if(i%2===0||i===days.length-1)g+=`<text x="${X(i)}" y="${H-6}" fill="#a0aec0" font-size="10" text-anchor="middle">${x.lab}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21d4fd" stop-opacity=".55"/><stop offset="1" stop-color="#21d4fd" stop-opacity="0"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0075ff" stop-opacity=".55"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${area('m')}" fill="url(#gb)"/><path d="${line('m')}" fill="none" stroke="#0075ff" stroke-width="3"/>
    <path d="${area('e')}" fill="url(#ga)"/><path d="${line('e')}" fill="none" stroke="#21d4fd" stroke-width="3"/></svg>`}
function barSvg(rows){if(!rows.length)return `<div class="empty">${esc(t('noData'))}</div>`;const W=320,H=190,B=34,max=Math.max(...rows.map(r=>r.n)),w=(W-20)/rows.length;
  return `<svg viewBox="0 0 ${W} ${H}">`+rows.map((r,i)=>{const h=Math.max(4,(H-B-16)*r.n/max),x=10+i*w+w/2;
    return `<rect x="${x-4}" y="${H-B-h}" width="8" height="${h}" rx="4" fill="#fff"/><text x="${x}" y="${H-B-h-6}" fill="#fff" font-size="10" text-anchor="middle">${r.n}</text>
    <text x="${x}" y="${H-B+14}" fill="#a0aec0" font-size="9" text-anchor="middle">${esc(nm(r.field).split(/[ &و]/)[0].slice(0,9))}</text>`}).join('')+'</svg>'}
function gaugeSvg(p){const r=80,c=Math.PI*r,v=Math.max(0,Math.min(100,p||0));
  return `<svg viewBox="0 0 200 118"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#0075ff"/><stop offset="1" stop-color="#21d4fd"/></linearGradient></defs>
  <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#22234b" stroke-width="14" stroke-linecap="round"/>
  ${v>0?`<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}"/>`:''}
  </svg>`}
const HERO_ART='<svg class="art" viewBox="0 0 240 240" fill="none" aria-hidden="true"><defs><radialGradient id="hr" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#21d4fd" stop-opacity=".35"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></radialGradient><linearGradient id="hs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21d4fd" stop-opacity=".75"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></linearGradient><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b8cff"/><stop offset="1" stop-color="#0058d6"/></linearGradient></defs><circle cx="120" cy="120" r="116" fill="url(#hr)"/><g stroke="#7cc4ff" stroke-opacity=".35" stroke-width="1.2"><circle cx="120" cy="120" r="38"/><circle cx="120" cy="120" r="74"/><circle cx="120" cy="120" r="110"/><path d="M120 10v220M10 120h220" stroke-opacity=".15"/></g><path d="M120 120 L120 10 A110 110 0 0 1 215 65 Z" fill="url(#hs)"/><g fill="#fff"><circle cx="184" cy="62" r="5"/><circle cx="58" cy="170" r="4" opacity=".7"/><circle cx="188" cy="176" r="6"/><circle cx="66" cy="72" r="3" opacity=".6"/></g><g transform="translate(86 92)"><rect x="18" y="0" width="32" height="20" rx="7" stroke="#fff" stroke-width="5"/><rect y="12" width="68" height="50" rx="12" fill="url(#hb)"/><rect y="30" width="68" height="6" fill="#21d4fd" opacity=".9"/><rect x="28" y="27" width="12" height="12" rx="3" fill="#fff"/></g><g transform="translate(150 148)"><circle r="15" fill="#01b574"/><path d="M-6 0l4 4 8-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>';
async function loadKpis(){const o=await call('/api/overview');const pct=o.applicationsToday?Math.round(100*o.autoToday/o.applicationsToday):0;
  const lr=o.lastRun;
  $('kpis').innerHTML=[[t('activeSubs'),o.active,'people',`<small>/ ${o.subscribers}</small>`],[t('appsToday'),o.applicationsToday,'send',''],[t('jobs7'),o.jobs7,'bag',''],[t('lastRun'),lr?fmtDT(lr.started_at):t('never'),'clock','']]
   .map(([k,v,ic,x])=>`<div class="kpi"><div class="t"><span>${esc(k)}</span><b>${esc(v)}${x}</b></div><div class="ic">${IC[ic]}</div></div>`).join('');
  $('hero').innerHTML=`${HERO_ART}<div class="hi">${esc(t('hello'))}</div><h2>${esc(ME.name)}</h2><p>${esc(t('heroText').replace('{c}',o.cities).replace('{f}',o.fieldsActive))}</p>
    <div class="go"><button class="sm" id="hero-go">${esc(t('heroBtn'))} →</button></div>`;$('hero-go').onclick=()=>tab('subs');
  $('gauge').innerHTML=gaugeSvg(pct)+`<div class="gauge-val"><b>${o.applicationsToday?pct+'%':'—'}</b><span>${esc(t('autoPct'))}</span></div>
    <div class="stat2"><div><span>${esc(t('sentCol'))}</span><b>${o.autoToday}</b></div><div><span>${esc(t('manualCol'))}</span><b>${o.applicationsToday-o.autoToday}</b></div></div>`;
  $('engineSub').textContent=t(o.live?'modeLive':'modeTest');
  $('engineBox').innerHTML=`<div class="stat2" style="margin-top:0"><div><span>${esc(t('status'))}</span><b><span class="pill ${esc(lr?lr.status:'')}">${esc(lr?lr.status:t('never'))}</span></b></div>
    <div><span>${esc(t('nextRun'))}</span><b>${esc(o.runTime)}</b></div><div><span>${esc(t('activeCities'))}</span><b>${o.cities}</b></div><div><span>${esc(t('withEmail'))}</span><b>${o.jobs7?Math.round(100*o.jobs7Email/o.jobs7)+'%':'—'}</b></div></div>
    <button class="ghost" style="width:100%;margin-top:14px" id="eng-set">${esc(t('settings'))}</button>`;
  $('eng-set').onclick=()=>tab(ME.role==='owner'?'settings':'overview');
  const map=Object.fromEntries((o.daily||[]).map(x=>[x.d,x]));const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=d.toISOString().slice(0,10);
    days.push({lab:d.toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short'}),e:+(map[k]?.e||0),m:+(map[k]?.m||0)})}
  const tot=days.reduce((a,x)=>a+x.e+x.m,0);$('appsSub').innerHTML=`<b>${tot}</b> ${esc(t('last14'))}`;$('areaChart').innerHTML=areaSvg(days);
  $('fieldsSub').innerHTML=`<b>${o.jobs7}</b> ${esc(t('last7'))}`;$('barChart').innerHTML=barSvg(o.fields||[]);
  $('fieldStats').innerHTML=`<div><span>${esc(t('fieldsTracked'))}</span><b>${o.fieldsActive}</b></div><div><span>${esc(t('activeCities'))}</span><b>${o.cities}</b></div>`;
  loadRuns();}
async function loadRuns(){const r=await call('/api/runs');const st=x=>x.stats||{};
  $('runs').innerHTML=(r.requested&&(!r.runs[0]||r.requested>r.runs[0].started_at)?`<p class="muted">${esc(t('queued'))}</p>`:'')+(r.runs.length?`<table><tr><th>${esc(t('started'))}</th><th>${esc(t('status'))}</th><th>${esc(t('newJobs'))}</th><th>${esc(t('sentCol'))}</th><th>${esc(t('manualCol'))}</th><th>${esc(t('errorsCol'))}</th></tr>`+r.runs.map(x=>`<tr><td>${esc(fmtDT(x.started_at))} · ${esc(x.place)}</td><td><span class="pill ${esc(x.status)}">${esc(x.status)}</span>${x.status==='running'&&st(x).phase?' <small class="mute">'+esc(st(x).phase)+'</small>':''}${st(x).dry_run?' · '+esc(t('dry')):''}</td><td>${esc(st(x).jobs_new??'')}</td><td>${esc(st(x).sent??'')}</td><td>${esc(st(x).manual??'')}</td><td title="${esc((st(x).errors||[]).join('\n'))}">${esc((st(x).errors||[]).length)}</td></tr>`+((st(x).preview||[]).length?`<tr><td colspan="6"><details><summary>${esc(t('preview'))} (${st(x).preview.length})</summary>${st(x).preview.map(p=>`<div class="muted"><b>${esc(p.score)} · ${esc(p.title)} — ${esc(p.company||'')} (${esc(p.city)})</b> → ${esc(p.method==='email'?p.to:t('manualCol'))}${p.body?`<pre style="white-space:pre-wrap">${esc(p.subject)}\n\n${esc(p.body)}</pre>`:''}</div>`).join('')}</details></td></tr>`:'')).join('')+'</table>':`<p class="muted">${esc(t('never'))}</p>`);}

$('run-now').onclick=async()=>{try{await call('/api/run-now',{method:'POST',body:{}});msg('run-msg',t('queued'),true);loadRuns()}catch(e){msg('run-msg',e.message)}};

async function boot(){applyLang();paintIcons();
  if(location.hash.startsWith('#set-password=')){show('setpw');return}
  try{await call('/api/me');return home()}catch{}
  try{const s=await call('/api/setup');show(s.needed?'setup':'login')}catch{show('login')}}
boot();
