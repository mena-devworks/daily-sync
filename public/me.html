<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>My job hunt</title>
<meta name="theme-color" content="#070b24">
<link rel="manifest" href="/me.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Job Hunter">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
.steps{margin:6px 0 0;padding-inline-start:22px;line-height:1.8;font-size:14px}.steps li{margin-bottom:8px}.steps a{color:var(--acc2)}
.note{border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.08);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13px;margin:12px 0}
.note.ok{border-color:rgba(1,181,116,.35);background:rgba(1,181,116,.08);color:var(--ok)}
.jt a.apply{color:var(--acc2);font-weight:700;text-decoration:none}.jt td{vertical-align:top}
.cvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cvc{border:1px solid var(--line);border-radius:18px;padding:16px;background:rgba(255,255,255,.03)}.cvc b{display:block;margin-bottom:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filters select{width:auto}
a.btn{display:inline-block;padding:10px 18px;border-radius:12px;background:var(--acc);color:#fff;font:600 13px var(--font);text-decoration:none}a.btn.sm{padding:6px 12px;font-size:12px;border-radius:10px}a.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line)}
code.k{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<!-- ================= auth ================= -->
<div class="auth" id="auth">
  <div class="auth-art">
    <svg class="radar" viewBox="0 0 400 400" fill="none" aria-hidden="true">
      <defs><radialGradient id="rg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#21d4fd" stop-opacity=".35"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></radialGradient>
      <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21d4fd" stop-opacity=".7"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></linearGradient></defs>
      <circle cx="200" cy="200" r="190" fill="url(#rg)"/>
      <g stroke="#6fb8ff" stroke-opacity=".35"><circle cx="200" cy="200" r="60"/><circle cx="200" cy="200" r="110"/><circle cx="200" cy="200" r="160"/><path d="M200 20v360M20 200h360"/></g>
      <path d="M200 200 L200 40 A160 160 0 0 1 338 120 Z" fill="url(#sw)"/>
      <g fill="#fff"><circle cx="270" cy="120" r="5"/><circle cx="130" cy="260" r="4" opacity=".7"/><circle cx="300" cy="250" r="6"/><circle cx="160" cy="150" r="3" opacity=".6"/></g>
      <g transform="translate(168 172)"><rect width="64" height="48" y="10" rx="10" fill="#0075ff"/><rect x="20" width="24" height="16" rx="5" stroke="#fff" stroke-width="4" fill="none"/><rect y="26" width="64" height="5" fill="#21d4fd" opacity=".8"/></g>
    </svg>
    <div class="brand"><span class="logo" data-ic="logo"></span>Job Hunter</div>
    <h2 style="margin-top:22px" data-t="artTitle"></h2><p data-t="artText"></p>
  </div>
  <div class="auth-side" style="position:relative">
    <div class="auth-top"><button class="ghost sm" id="langBtn">العربية</button></div>
    <div id="v-login" class="card hidden">
      <div class="brand"><span class="logo" data-ic="logo"></span>Job Hunter</div>
      <h1 data-t="welcome"></h1><p class="mute" style="margin:0" data-t="loginHint"></p>
      <label data-t="email"></label><input id="l-email" type="email" autocomplete="username">
      <label data-t="password"></label><input id="l-pw" type="password" autocomplete="current-password">
      <button id="l-go" style="width:100%;margin-top:20px" data-t="signIn"></button>
      <div class="row" style="margin-top:10px;justify-content:center"><button class="ghost sm" id="l-forgot" data-t="forgot"></button></div>
      <div class="msg" id="l-msg"></div>
    </div>
    <div id="v-setpw" class="card hidden">
      <div class="brand"><span class="logo" data-ic="logo"></span>Job Hunter</div>
      <h1 data-t="setPw"></h1>
      <label data-t="newPw"></label><input id="p-pw" type="password" autocomplete="new-password">
      <label data-t="confirmPw"></label><input id="p-pw2" type="password" autocomplete="new-password">
      <button id="p-go" style="width:100%;margin-top:20px" data-t="save"></button>
      <div class="msg" id="p-msg"></div>
    </div>
  </div>
</div>

<!-- ================= app ================= -->
<div id="v-home" class="app hidden">
  <aside class="side"><div class="side-in">
    <div class="brand"><span class="logo" data-ic="logo"></span>Job Hunter</div>
    <nav class="nav">
      <button data-tab="overview"><span class="ic" data-ic="home"></span><span data-t="overview"></span></button>
      <button data-tab="jobs"><span class="ic" data-ic="list"></span><span data-t="jobs"></span></button>
      <button data-tab="cvs"><span class="ic" data-ic="doc"></span><span data-t="cvs"></span></button>
      <button data-tab="email"><span class="ic" data-ic="mail"></span><span data-t="emailTab"></span></button>
    </nav>
    <div class="help"><span class="ic" data-ic="radar"></span><b data-t="subCard"></b><p id="side-sub"></p></div>
  </div></aside>

  <main class="main">
    <header class="top">
      <span class="logo mlogo brand" style="padding:0"><span class="logo" data-ic="logo"></span></span>
      <div><div class="crumb"><span data-t="pages"></span> / <b id="crumb"></b></div><h1 id="pageTitle"></h1></div>
      <span class="sp"></span>
      <button class="ghost sm" id="langBtn2">العربية</button>
      <span class="who"><span class="avatar" id="avatar"></span><span id="who"></span></span>
      <button class="ghost sm" id="out" data-t="signOut"></button>
    </header>
    <div class="note hidden" id="ro-note"></div>

    <section data-p="overview">
      <div class="kpis" id="kpis"></div>
      <div class="ovgrid">
        <div class="card hero" id="hero"></div>
        <div class="card"><h2 data-t="autoRate"></h2><div class="sub-h" data-t="autoRateHint"></div><div class="gauge-wrap" id="gauge"></div></div>
        <div class="card"><h2 data-t="mySearch"></h2><div class="sub-h" id="modeSub"></div><div id="searchBox"></div></div>
      </div>
      <div class="chartgrid">
        <div class="card chart"><h2 data-t="appsChart"></h2><div class="sub-h" id="appsSub"></div><div id="areaChart"></div>
          <div class="legend"><span><i style="background:#21d4fd"></i><span data-t="sentCol"></span></span><span><i style="background:#0075ff"></i><span data-t="manualCol"></span></span></div></div>
        <div class="card chart"><h2 data-t="byField"></h2><div class="sub-h" data-t="byFieldHint"></div><div class="bars" id="barChart"></div></div>
      </div>
    </section>

    <section class="card hidden" data-p="jobs">
      <div class="row"><h2 style="margin:0" data-t="jobs"></h2><span class="sp"></span><input id="q" style="max-width:240px" data-ph="search"></div>
      <p class="mute" style="font-size:12px;margin:6px 0 0" data-t="jobsHint"></p>
      <div class="filters"><select id="f-days"><option value="7">7</option><option value="30" selected>30</option><option value="90">90</option></select>
        <select id="f-st"><option value="" data-t="allStatus"></option><option value="sent" data-t="stSent"></option><option value="manual" data-t="stManual"></option></select></div>
      <div style="overflow-x:auto"><table class="stack jt"><thead><tr><th data-t="job"></th><th data-t="city"></th><th data-t="score"></th><th data-t="status"></th><th data-t="date"></th><th></th></tr></thead><tbody id="jobs"></tbody></table></div>
      <div class="msg" id="j-msg"></div>
    </section>

    <section class="card hidden" data-p="cvs">
      <h2 data-t="cvs"></h2><p class="mute" style="font-size:13px" data-t="cvsHint"></p>
      <div class="cvs" id="cvs"></div>
    </section>

    <section class="card hidden" data-p="email">
      <h2 data-t="emailTab"></h2>
      <div class="note" id="ap-state"></div>
      <p class="mute" style="font-size:13px" data-t="apWhy"></p>
      <h3 data-t="apSteps"></h3>
      <ol class="steps" id="ap-steps"></ol>
      <div id="ap-form">
        <label data-t="apLabel"></label>
        <div class="row"><input id="ap" type="password" autocomplete="off" style="max-width:320px" placeholder="abcd efgh ijkl mnop"><button id="ap-save" data-t="save"></button></div>
        <label class="opt hidden" id="ap-clearbox" style="margin-top:12px"><input type="checkbox" id="ap-clear"><span data-t="apClear"></span></label>
        <small class="mute" data-t="apSafe"></small>
      </div>
      <div class="msg" id="ap-msg"></div>
    </section>
  </main>

  <nav class="bnav">
    <button data-tab="overview"><span class="ic" data-ic="home"></span><span data-t="overview"></span></button>
    <button data-tab="jobs"><span class="ic" data-ic="list"></span><span data-t="jobs"></span></button>
    <button data-tab="cvs"><span class="ic" data-ic="doc"></span><span data-t="cvs"></span></button>
    <button data-tab="email"><span class="ic" data-ic="mail"></span><span data-t="emailTab"></span></button>
  </nav>
</div>

let lang=(()=>{try{return localStorage.getItem('lang')||'en'}catch{return'en'}})();
const $=id=>document.getElementById(id), t=k=>T[lang][k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(id,text,ok){$(id).textContent=text;$(id).classList.toggle('ok',!!ok);}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('langBtn').textContent=$('langBtn2').textContent=lang==='ar'?'English':'العربية';}
$('langBtn').onclick=$('langBtn2').onclick=()=>{lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lang',lang)}catch{}applyLang();if(ME){call('/api/me/lang',{method:'PUT',body:{lang}}).catch(()=>{});frame();tab(TAB)}};
async function call(path,opt={}){const r=await fetch(path,{method:opt.method||'GET',headers:{'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined,credentials:'same-origin'});
  let d={};try{d=await r.json()}catch{}if(!r.ok)throw Object.assign(new Error(d.error||r.status),{status:r.status});return d;}
function show(v){['login','setpw','home'].forEach(x=>$('v-'+x).classList.toggle('hidden',x!==v));$('auth').classList.toggle('hidden',v==='home');}

$('l-go').onclick=async()=>{try{await call('/api/me/login',{method:'POST',body:{email:$('l-email').value,password:$('l-pw').value}});boot()}catch(e){msg('l-msg',e.message)}};
$('l-pw').onkeydown=e=>{if(e.key==='Enter')$('l-go').click()};
$('l-forgot').onclick=async()=>{try{await call('/api/me/forgot',{method:'POST',body:{email:$('l-email').value}});msg('l-msg',t('forgotDone'),true)}catch(e){msg('l-msg',e.message)}};
$('p-go').onclick=async()=>{if($('p-pw').value!==$('p-pw2').value)return msg('p-msg',t('mismatch'));
  try{const d=await call('/api/set-password',{method:'POST',body:{token:location.hash.split('=')[1],password:$('p-pw').value}});msg('p-msg',t('pwDone'),true);
    const pw=$('p-pw').value;history.replaceState(null,'',location.pathname);
    await call('/api/me/login',{method:'POST',body:{slug:d.slug,password:pw}}).catch(()=>{});setTimeout(boot,600)}catch(e){msg('p-msg',e.message)}};
$('out').onclick=async()=>{await call('/api/me/logout',{method:'POST'}).catch(()=>{});ME=null;boot()};

function paintIcons(root=document){root.querySelectorAll('[data-ic]').forEach(e=>{if(!e.firstChild)e.innerHTML=IC[e.dataset.ic]||''})}
function labelCells(tb){const th=[...tb.closest('table').querySelectorAll('thead th')].map(x=>x.textContent);tb.querySelectorAll('tr').forEach(r=>[...r.children].forEach((c,i)=>{if(th[i])c.dataset.l=th[i]}))}
const fmtDT=s=>s?new Date(s.replace(' ','T')+'Z').toLocaleString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
function smooth(pts){if(pts.length<2)return'';let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function areaSvg(days){const W=600,H=230,L=34,R=26,T=14,B=26,max=Math.max(4,...days.map(x=>Math.max(x.e,x.m)));const top=Math.ceil(max/4)*4;
  const X=i=>L+i*(W-L-R)/(days.length-1),Y=v=>T+(1-v/top)*(H-T-B);
  const line=k=>smooth(days.map((x,i)=>[X(i),Y(x[k])])),area=k=>line(k)+` L${X(days.length-1)},${H-B} L${X(0)},${H-B} Z`;
  let g='';for(let j=0;j<=4;j++){const v=top*j/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#56577a" stroke-dasharray="4 5" stroke-opacity=".5"/><text x="${L-8}" y="${y+4}" fill="#a0aec0" font-size="10" text-anchor="end">${v}</text>`}
  days.forEach((x,i)=>{if(i%2===0||i===days.length-1)g+=`<text x="${X(i)}" y="${H-6}" fill="#a0aec0" font-size="10" text-anchor="middle">${x.lab}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#21d4fd" stop-opacity=".55"/><stop offset="1" stop-color="#21d4fd" stop-opacity="0"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0075ff" stop-opacity=".55"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></linearGradient></defs>${g}
    <path d="${area('m')}" fill="url(#gb)"/><path d="${line('m')}" fill="none" stroke="#0075ff" stroke-width="3"/>
    <path d="${area('e')}" fill="url(#ga)"/><path d="${line('e')}" fill="none" stroke="#21d4fd" stroke-width="3"/></svg>`}
function barSvg(rows){if(!rows.length)return `<div class="empty">${esc(t('noData'))}</div>`;const W=320,H=190,B=34,max=Math.max(...rows.map(r=>r.n)),w=(W-20)/rows.length;
  return `<svg viewBox="0 0 ${W} ${H}">`+rows.map((r,i)=>{const h=Math.max(4,(H-B-16)*r.n/max),x=10+i*w+w/2;
    return `<rect x="${x-4}" y="${H-B-h}" width="8" height="${h}" rx="4" fill="#fff"/><text x="${x}" y="${H-B-h-6}" fill="#fff" font-size="10" text-anchor="middle">${r.n}</text>
    <text x="${x}" y="${H-B+14}" fill="#a0aec0" font-size="9" text-anchor="middle">${esc(nm(r.field).split(/[ &و]/)[0].slice(0,9))}</text>`}).join('')+'</svg>'}
function gaugeSvg(p){const r=80,c=Math.PI*r,v=Math.max(0,Math.min(100,p||0));
  return `<svg viewBox="0 0 200 118"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#0075ff"/><stop offset="1" stop-color="#21d4fd"/></linearGradient></defs>
  <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#22234b" stroke-width="14" stroke-linecap="round"/>
  ${v>0?`<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}"/>`:''}
  </svg>`}
const HERO_ART='<svg class="art" viewBox="0 0 240 240" fill="none" aria-hidden="true"><defs><radialGradient id="hr" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#21d4fd" stop-opacity=".35"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></radialGradient><linearGradient id="hs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#21d4fd" stop-opacity=".75"/><stop offset="1" stop-color="#0075ff" stop-opacity="0"/></linearGradient><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b8cff"/><stop offset="1" stop-color="#0058d6"/></linearGradient></defs><circle cx="120" cy="120" r="116" fill="url(#hr)"/><g stroke="#7cc4ff" stroke-opacity=".35" stroke-width="1.2"><circle cx="120" cy="120" r="38"/><circle cx="120" cy="120" r="74"/><circle cx="120" cy="120" r="110"/><path d="M120 10v220M10 120h220" stroke-opacity=".15"/></g><path d="M120 120 L120 10 A110 110 0 0 1 215 65 Z" fill="url(#hs)"/><g fill="#fff"><circle cx="184" cy="62" r="5"/><circle cx="58" cy="170" r="4" opacity=".7"/><circle cx="188" cy="176" r="6"/><circle cx="66" cy="72" r="3" opacity=".6"/></g><g transform="translate(86 92)"><rect x="18" y="0" width="32" height="20" rx="7" stroke="#fff" stroke-width="5"/><rect y="12" width="68" height="50" rx="12" fill="url(#hb)"/><rect y="30" width="68" height="6" fill="#21d4fd" opacity=".9"/><rect x="28" y="27" width="12" height="12" rx="3" fill="#fff"/></g><g transform="translate(150 148)"><circle r="15" fill="#01b574"/><path d="M-6 0l4 4 8-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>';
Object.assign(IC,{list:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2" opacity=".75"/><rect x="3" y="16" width="18" height="4" rx="2" opacity=".5"/></svg>',
doc:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5z"/></svg>',
mail:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v.6l-10 6.2L2 6.6V6a1 1 0 0 1 1-1zm-1 4 10 6.2L22 9v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></svg>'});

let ME=null,TAB='overview',JOBS=[];
function tab(x){TAB=x;$('crumb').textContent=$('pageTitle').textContent=t(x==='email'?'emailTab':x);
  document.querySelectorAll('#v-home [data-p]').forEach(e=>e.classList.toggle('hidden',e.dataset.p!==x));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===x));
  ({overview:loadOverview,jobs:loadJobs,cvs:loadCvs,email:drawEmail})[x]().catch(e=>{if(e.status===401)return boot();console.warn(e)});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab(b.dataset.tab);window.scrollTo(0,0)});
const dd=s=>new Date(s+'T00:00:00Z').toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
function frame(){$('who').textContent=ME.name;$('avatar').textContent=(ME.name||'?').trim().charAt(0).toUpperCase();
  $('side-sub').textContent=t(ME.readOnly&&!ME.locked?'subEnded':'subUntil').replace('{d}',dd(ME.sub_end));
  $('ro-note').classList.toggle('hidden',!ME.readOnly);$('ro-note').textContent=ME.locked?t('lockedNote'):t('roNote').replace('{d}',dd(ME.sub_end));}
async function home(){show('home');document.title='Job Hunter';frame();tab(TAB);}

async function loadOverview(){const o=await call('/api/me/overview');const wk=o.weekSent+o.weekManual,pct=wk?Math.round(100*o.weekSent/wk):0;
  $('kpis').innerHTML=[[t('kToday'),o.todaySent+o.todayManual,'send'],[t('kWeek'),wk,'bolt'],[t('kAuto'),wk?pct+'%':'—','people'],[t('kMatch'),o.matched,'bag']]
   .map(([k,v,ic])=>`<div class="kpi"><div class="t"><span>${esc(k)}</span><b>${esc(v)}</b></div><div class="ic">${IC[ic]}</div></div>`).join('');
  $('hero').innerHTML=`${HERO_ART}<div class="hi">${esc(t('hello'))}</div><h2>${esc(ME.name)}</h2><p>${esc(t('heroText').replace('{c}',ME.cities.length).replace('{f}',ME.fields.length))}</p>
    <div class="go"><button class="sm" id="hero-go">${esc(t('heroBtn'))} →</button></div>`;$('hero-go').onclick=()=>tab('jobs');
  $('gauge').innerHTML=gaugeSvg(pct)+`<div class="gauge-val"><b>${wk?pct+'%':'—'}</b><span>${esc(t('kAuto'))}</span></div>
    <div class="stat2"><div><span>${esc(t('sentCol'))}</span><b>${o.weekSent}</b></div><div><span>${esc(t('manualCol'))}</span><b>${o.weekManual}</b></div></div>`;
  $('modeSub').textContent=t(ME.live?'modeLive':'modeTest');
  $('searchBox').innerHTML=`<div class="stat2" style="margin-top:0"><div><span>${esc(t('cities'))}</span><b>${ME.cities.length}</b></div><div><span>${esc(t('fields'))}</span><b>${ME.fields.length}</b></div>
    <div><span>${esc(t('sendFrom'))}</span><b>${esc(t(ME.has_app_password?'fromMine':'fromCentral'))}</b></div><div><span>${esc(t('dailyRun'))}</span><b>${esc(ME.runTime)}</b></div></div>
    <div class="chips" style="margin-top:14px">${ME.fields.map(f=>`<span class="chip">${esc(nm(f.field))}</span>`).join('')}</div>
    <p class="mute" style="font-size:12px;margin:10px 0 0">${ME.cities.map(c=>esc(nm(c.city))).join(' · ')}</p>`;
  const map=Object.fromEntries((o.daily||[]).map(x=>[x.d,x]));const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5),k=d.toISOString().slice(0,10);
    days.push({lab:d.toLocaleDateString(lang==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short'}),e:+(map[k]?.e||0),m:+(map[k]?.m||0)})}
  const tot=days.reduce((a,x)=>a+x.e+x.m,0);$('appsSub').innerHTML=`<b>${tot}</b> ${esc(t('last14'))}`;$('areaChart').innerHTML=areaSvg(days);
  $('barChart').innerHTML=barSvg(o.fields||[]);}

async function loadJobs(){JOBS=await call('/api/me/jobs?days='+$('f-days').value);drawJobs();}
const cvUrl=f=>'/api/me/cv/'+encodeURIComponent(f);
function drawJobs(){const q=$('q').value.trim().toLowerCase(),st=$('f-st').value;
  const rows=JOBS.filter(j=>(!st||j.status===st)&&(!q||(j.title+' '+(j.company||'')+' '+(j.city||'')).toLowerCase().includes(q)));
  const lab={sent:'stSent',manual:'stManual',failed:'stFailed'},cls={sent:'ok',manual:'running',failed:'failed'};
  $('jobs').innerHTML=rows.map(j=>`<tr><td><b>${esc(j.title)}</b><br><small class="mute">${esc(j.company||'')} · ${esc(nm(j.field||''))}</small></td><td>${esc(nm(j.city||''))}</td>
    <td>${j.score??'—'}</td><td><span class="pill ${cls[j.status]||''}">${esc(t(lab[j.status]||j.status))}</span></td><td>${esc(fmtDT(j.created_at))}</td>
    <td class="acts">${j.url?`<a class="apply" href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">${esc(t('open'))} ↗</a>`:''}${j.has_pdf?` <a class="ghost sm btn" href="${cvUrl(j.field)}">${esc(t('cv'))} ⬇</a>`:''}</td></tr>`).join('')
    ||`<tr><td colspan="6" class="mute">${esc(t('noJobs'))}</td></tr>`;labelCells($('jobs'));}
$('q').oninput=drawJobs;$('f-st').onchange=drawJobs;$('f-days').onchange=()=>loadJobs();

async function loadCvs(){const r=await call('/api/me/cvs');
  $('cvs').innerHTML=r.map(c=>`<div class="cvc"><b>${esc(nm(c.field))}</b><small class="mute">${esc(t('updated'))}: ${esc(fmtDT(c.updated_at))} · ${Math.max(1,Math.round(c.size/1024))} KB</small>
    <div style="margin-top:12px"><a class="btn sm" href="${cvUrl(c.field)}">${esc(t('download'))}</a></div></div>`).join('')||`<div class="empty">${esc(t('noCvs'))}</div>`;}

async function drawEmail(){const s=$('ap-state');s.textContent=ME.has_app_password?t('apOn').replace('{e}',ME.email):t('apOff');s.classList.toggle('ok',ME.has_app_password);
  $('ap-steps').innerHTML=[1,2,3,4,5,6].map(i=>`<li>${t('st'+i).replace('{e}','<b>'+esc(ME.email)+'</b>')}</li>`).join('');
  $('ap-clearbox').classList.toggle('hidden',!ME.has_app_password);$('ap-clear').checked=false;
  $('ap-form').querySelectorAll('input,button').forEach(e=>e.disabled=ME.readOnly);msg('ap-msg',ME.readOnly?t('apRO'):'');}
$('ap-save').onclick=async()=>{const clear=$('ap-clear').checked;
  try{const d=await call('/api/me/app-password',{method:'PUT',body:clear?{clear:true}:{app_password:$('ap').value}});ME.has_app_password=d.has_app_password;$('ap').value='';
    drawEmail();msg('ap-msg',t(clear?'apRemoved':'apSaved'),true)}catch(e){msg('ap-msg',e.message)}};

async function boot(){applyLang();paintIcons();
  if(location.hash.startsWith('#set-password=')){show('setpw');return}
  try{ME=await call('/api/me/info');let has=true;try{has=!!localStorage.getItem('lang')}catch{}if(ME.lang&&!has){lang=ME.lang;applyLang()}return home()}catch{}
  ME=null;show('login');document.title='Sign in';}
boot();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
